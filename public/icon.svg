<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990011;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0A0A0A"/>
  <circle cx="256" cy="256" r="180" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Concentric Vinyl / Sound Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <!-- Center Play / Note Triangle -->
  <polygon points="220,186 330,256 220,326" fill="#FFFFFF"/>
</svg>
